<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% set site_url = "https://docs.luca-borruto.com" %}
{% set site_name = "Today I Learned" %}
<title>{% block title %}{% endblock %}</title>
<meta name="description" content="{% block description %}Short technical write-ups on web scraping, anti-bot systems, proxies, self-hosting and PC builds.{% endblock %}">
<link rel="canonical" href="{{ site_url }}{% block canonical_path %}{{ request.path }}{% endblock %}">
<meta name="author" content="Luca Borruto">
<meta name="theme-color" content="#644382">
<meta property="og:site_name" content="{{ site_name }}">
<meta property="og:type" content="{% block og_type %}website{% endblock %}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:url" content="{{ site_url }}{{ self.canonical_path() }}">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ self.title() }}">
<meta name="twitter:description" content="{{ self.description() }}">
{% block structured_data %}{% endblock %}
<link rel="alternate" type="application/atom+xml" title="Atom" href="/tils/feed.atom">
{% block extra_head %}{% endblock %}
<style>
body {
    font-family: "Helvetica Neue", helvetica, sans-serif;
    line-height: 1.4;
    margin: 0;
    padding: 0;
}
h1 {
    font-family: Georgia, 'Times New Roman', Times, serif;
}
.created {
    border-top: 1px solid #ccc;
    padding-top: 1em;
    font-size: 0.8em;
}
.topic {
    background-color: #ccc;
    padding: 3px;
    border: 1px solid #777;
    font-size: 0.65em;
    position: relative;
    top: -1px;
}
.topic a {
    text-decoration: none;
    color: black;
}
pre {
    white-space: pre-wrap;
}
pre[lang=wide] {
    white-space: pre;
    overflow: auto;
}
nav {
    text-align: left;
    background: linear-gradient(to bottom, rgb(154, 103, 175) 0%, rgb(96, 72, 129) 49%, rgb(100, 67, 130) 100%);
    color: white;
}
nav p {
    display: flex;
    justify-content: space-between;
    margin: 0;
    padding: 4px 2em;
}
nav a:link,
nav a:visited,
nav a:hover,
nav a:focus,
nav a:active {
    color: white;
    text-decoration: none;
}
section.body {
    padding: 0.5em 2em;
    max-width: 800px;
}
@media (max-width: 600px) {
    section.body {
        padding: 0em 1em;
    }
    nav p {
        padding: 4px 1em;
    }
}
a, pre, code {
    overflow-wrap: break-word;
}
table {
    border-collapse: collapse;
}
th, td {
    padding: 0.3em;
    border: 1px solid #D3D3D3;
    word-wrap: anywhere;
}
th {
    background-color: #eee;
}
ul.related {
    list-style-type: none;
    margin: 0;
    padding: 0;
}
ul.related li {
    margin-bottom: 0.3em;
}
nav.breadcrumb {
    background: none;
    color: #555;
    font-size: 0.85em;
    margin-top: 1em;
}
nav.breadcrumb a:link,
nav.breadcrumb a:visited {
    color: #644382;
}
blockquote {
    margin: 1em 0;
    border-left: 0.75em solid #9e6bb52e;
    padding-left: 0.75em;
}
</style>
</head>
<body>
<nav>
    <p><a href="/">Today I Learned</a></p>
</nav>
<section class="body">
{% block body %}{% endblock %}
</section>
</body>
</html>
